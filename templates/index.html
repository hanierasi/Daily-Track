<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DailyTrack | Habit Dashboard </title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2 class="logo"><img src="../icon/psychiatry_35dp_48752C_FILL0_wght300_GRAD0_opsz40.png">
            DailyTrack</h2>
        <nav class="sidebar-nav">
            <a href=""><img src="../icon/cottage_35dp_48752C_FILL0_wght300_GRAD0_opsz40.png">
                <span>Dashboard</span></a>
            <a href=""><img src="../icon/check_circle_35dp_48752C_FILL0_wght300_GRAD0_opsz40.png">
                <span>My Habits</span></a>
            <a href=""><img src="../icon/bar_chart_35dp_48752C_FILL0_wght300_GRAD0_opsz40.png">
                <span>Statistics</span></a>
            <a href=""><img src="../icon/calendar_month_35dp_48752C_FILL0_wght300_GRAD0_opsz40.png">
                <span>Calendar</span></a>
            <a href=""><img src="../icon/mail_35dp_48752C_FILL0_wght300_GRAD0_opsz40.png">
                <span>About</span></a>
        </nav>
    </aside>
    <main class="main-content">
    <header class="home-header">
        <h1>Good morning</h1>
        <p>Lets make productive</p>
    </header>
        <section class="daily-progress">
            <h2>Daily progress</h2>
            <div class="progress-info">
               <div>
                   <h3>65%</h3>
                   <p>you have made great progress</p>
               </div>
            </div>
            <div class="progress-bar">
                <div class="progress-file"></div>
            </div>
            <p class="progress-text">3-5 habits completed</p>
        </section>
        <section class="my-habits">
            <h2>My Habits</h2>
            <div class="habit_list">
                <div class="habit_item">
                    <span>Morning Exercise</span>
                    <input type="checkbox">
                </div>
                <div class="habit_item">
                    <span>Reading 20 minutes</span>
                    <input type="checkbox">
                </div>
                <div class="habit_item">
                    <span>learn Coding</span>
                    <input type="checkbox">
                </div>
        </section>
</main>
</div>
</body>
</html>
